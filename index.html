<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icones/portail.png">
<title>Math et sciences avec M. Stéphane</title>
<style>
  .hero { max-width: 1080px; margin: 0 auto; padding: 72px 20px 24px; text-align: center; }
  .hero h1 { font-family: var(--pixel); color: var(--blanc); font-size: clamp(26px, 7vw, 60px); line-height: 1.35; text-shadow: 5px 5px 0 var(--nuit); }
  .hero p { margin: 22px 0 0; color: var(--blanc); font-weight: 700; font-size: 20px; text-shadow: 2px 2px 0 var(--nuit); }
  .portes { max-width: 1080px; margin: 0 auto; padding: 32px 20px 72px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px; align-content: start; }
  .porte { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding: 28px 22px 26px; text-decoration: none; }
  .porte:hover { background: #FFF6D6; }
  .porte:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--nuit); }
  .porte img { width: 112px; height: 112px; }
  .porte h2 { font-family: var(--pixel); font-size: 18px; line-height: 1.5; }
  .porte p { margin: 0; }
  .porte.vedette { background: var(--or); }
  .porte.vedette:hover { background: #FFD24A; }
</style>
</head>
<body>
<div class="hero">
  <h1>Math et sciences</h1>
  <p>Avec M. Stéphane, École Marie-Anne, 3e à 6e année</p>
</div>

<main class="portes">
  <a class="bloc porte vedette" data-portail href="#">
    <img class="pix" src="icones/portail.png" alt="" width="112" height="112">
    <h2>Le portail</h2>
    <p>Entre avec ton numéro et ton code secret.</p>
  </a>
  <a class="bloc porte" href="math.html">
    <img class="pix" src="icones/compas.png" alt="" width="112" height="112">
    <h2>Math</h2>
    <p>Des jeux et des outils pour pratiquer.</p>
  </a>
  <a class="bloc porte" href="sciences.html">
    <img class="pix" src="icones/eprouvette.png" alt="" width="112" height="112">
    <h2>Sciences</h2>
    <p>Le projet en cours, des défis et des découvertes.</p>
  </a>
</main>

<footer>
  <p class="pied-texte">M. Stéphane, École Marie-Anne, <span id="annee"></span></p>
  <div class="sol" aria-hidden="true"></div>
</footer>
<script src="site.js"></script>
</body>
</html>
